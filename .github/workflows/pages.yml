# Builds the site in path mode and publishes it to GitHub Pages on every push to main.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tribea-website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli numpy pillow
      - run: npm ci
        working-directory: tribea-website
      - run: npm run build
        working-directory: tribea-website
        env:
          TRIBEA_MODE: path
          TRIBEA_BASE: /tribea
          TRIBEA_DOMAIN: vincentdevs.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tribea-website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
